<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor 主题</title>
<link rel="icon" href="favicon.svg">
<meta name="description" content="Monitor 探针的公开状态页主题：在线预览，复制地址即可安装。">
<style>
  :root {
    color-scheme: light dark;
    --bg: oklch(1 0 0);
    --fg: oklch(0.18 0 0);
    --card: oklch(1 0 0);
    --muted: oklch(0.955 0 0);
    --muted-fg: oklch(0.52 0 0);
    --border: oklch(0.9 0 0);
    --primary: oklch(0.18 0 0);
    --primary-fg: oklch(0.99 0 0);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.145 0 0);
      --fg: oklch(0.98 0 0);
      --card: oklch(0.2 0 0);
      --muted: oklch(0.27 0 0);
      --muted-fg: oklch(0.7 0 0);
      --border: oklch(1 0 0 / 12%);
      --primary: oklch(0.92 0 0);
      --primary-fg: oklch(0.2 0 0);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  a { color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header { padding: 40px 0 24px; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.01em; }
  .lead { margin: 0; color: var(--muted-fg); max-width: 46em; }
  .lead b { color: var(--fg); font-weight: 600; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 24px 0 16px; }
  .bar input {
    flex: 1 1 240px; min-width: 0; height: 38px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--fg); font: inherit;
  }
  .bar input:focus { outline: 2px solid var(--muted-fg); outline-offset: 1px; }
  .count { color: var(--muted-fg); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding-bottom: 40px; }
  .card {
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
  }
  .shot { display: block; aspect-ratio: 16 / 10; overflow: hidden; background: var(--muted); border-bottom: 1px solid var(--border); }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .body { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; flex: 1; }
  .title { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 17px; line-height: 1.4; }
  .title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    flex: none; padding: 0 7px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 12px; font-weight: 500; color: var(--muted-fg);
  }
  .meta { margin: 0; color: var(--muted-fg); font-size: 13px; overflow-wrap: anywhere; }
  .desc {
    margin: 0; font-size: 14px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }
  .btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg);
    font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--muted); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
  .btn.primary:hover { opacity: 0.9; }
  .btn.src { flex: none; }
  .empty { grid-column: 1 / -1; padding: 48px 0; text-align: center; color: var(--muted-fg); }
  footer { border-top: 1px solid var(--border); padding: 20px 0 32px; color: var(--muted-fg); font-size: 13px; }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Monitor 主题</h1>
    <p class="lead">
      公开状态页的主题，点「在线预览」看效果。看中了就点<b>「复制安装地址」</b>，粘贴到 hub 面板<b>「主题」</b>页，点<b>「从 GitHub 安装」</b>（hub 1.3.2 起支持）。
    </p>
    <div class="bar">
      <input id="q" type="search" placeholder="搜索名称、作者、简介" aria-label="搜索主题" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
  </header>
  <main class="grid" id="grid" aria-live="polite"><p class="empty">正在加载…</p></main>
  <footer>
    <p>预览页里的节点和数字都是生成的，不对应任何真实服务器。</p>
    <p>主题是在访客浏览器里运行的第三方代码，和 hub 同源，只装信得过的来源。主题由作者在各自的仓库里维护。</p>
    <p><a href="https://github.com/monitor-probe/themes">收录你的主题</a> · <a href="https://monitor-document.pages.dev/dev/theme">主题开发文档</a></p>
  </footer>
</div>
<script>
  const grid = document.getElementById("grid")
  const count = document.getElementById("count")
  const q = document.getElementById("q")
  let themes = [], project = ""

  const el = (tag, props = {}, ...children) => {
    const node = Object.assign(document.createElement(tag), props)
    node.append(...children)
    return node
  }
  const day = (iso) => iso.slice(0, 10)

  async function copy(button, text) {
    try {
      await navigator.clipboard.writeText(text)
      button.textContent = "已复制"
      setTimeout(() => (button.textContent = "复制安装地址"), 2000)
    } catch {
      prompt("复制这个地址", text)
    }
  }

  function card(t) {
    const preview = `https://${t.alias}.${project}.pages.dev/`
    const copyButton = el("button", { className: "btn primary", type: "button", textContent: "复制安装地址" })
    copyButton.addEventListener("click", () => copy(copyButton, t.repo))
    const title = el("h2", { className: "title" }, el("span", { textContent: t.name, title: t.name }))
    if (t.official) title.append(el("span", { className: "badge", textContent: "官方" }))
    const meta = [t.author, t.version && `v${t.version}`, `${day(t.released)} 更新`].filter(Boolean).join(" · ")
    return el("article", { className: "card" },
      el("a", { className: "shot", href: preview, target: "_blank", rel: "noopener", ariaLabel: `在线预览 ${t.name}` },
        el("img", { src: `previews/${t.alias}.png`, alt: `${t.name} 截图`, loading: "lazy", decoding: "async" })),
      el("div", { className: "body" },
        title,
        el("p", { className: "meta", textContent: meta }),
        el("p", { className: "desc", textContent: t.description }),
        el("div", { className: "actions" },
          el("a", { className: "btn", href: preview, target: "_blank", rel: "noopener", textContent: "在线预览" }),
          copyButton,
          el("a", { className: "btn src", href: t.repo, target: "_blank", rel: "noopener", textContent: "源码" }))))
  }

  function render() {
    const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean)
    const shown = themes.filter((t) => {
      const text = [t.name, t.short, t.author, t.description, t.repo].join(" ").toLowerCase()
      return words.every((w) => text.includes(w))
    })
    count.textContent = words.length ? `${shown.length} / ${themes.length} 个主题` : `${themes.length} 个主题`
    grid.replaceChildren(...(shown.length ? shown.map(card) : [el("p", { className: "empty", textContent: "没有匹配的主题" })]))
  }

  fetch("themes.json", { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((index) => {
      themes = index.themes
      project = index.project
      render()
      q.addEventListener("input", render)
    })
    .catch(() => grid.replaceChildren(el("p", { className: "empty", textContent: "主题列表加载失败，稍后刷新再试" })))
</script>
</body>
</html>
